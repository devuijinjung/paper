databases:
  - name: paper-trading-db
    plan: free
    databaseName: paper_trading

services:
  - type: web
    name: paper-trading
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paper-trading-db
          property: connectionString
      - key: WEBHOOK_SECRET
        generateValue: true        # Render이 자동으로 안전한 토큰 생성
      - key: INITIAL_CAPITAL
        value: "10000.0"
      - key: FEE_RATE
        value: "0.001"
      - key: SLIPPAGE
        value: "0.0005"
